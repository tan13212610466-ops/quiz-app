<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国际中文教师证书考试系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1d4ed8;--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--success:#16a34a;--danger:#dc2626;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Login Page */
.login-page{width:100%;max-width:400px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:var(--card);border-radius:var(--radius);padding:40px 32px;box-shadow:var(--shadow)}
.login-card h1{font-size:22px;text-align:center;margin-bottom:6px;color:var(--primary)}
.login-card .subtitle{text-align:center;font-size:13px;color:var(--text-light);margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:4px;color:var(--text)}
.form-group input{width:100%;height:44px;border:1.5px solid var(--border);border-radius:8px;padding:0 14px;font-size:15px;outline:none;transition:border .2s}
.form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group .error{color:var(--danger);font-size:12px;margin-top:4px;display:none}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.remember-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.remember-row label{font-size:14px;color:var(--text-light);cursor:pointer}
.btn{width:100%;height:44px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:0 0;color:var(--primary);margin-top:12px}
.btn-ghost:hover{opacity:.7}
.divider{text-align:center;font-size:12px;color:var(--text-light);margin:16px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.login-tip{text-align:center;font-size:12px;color:var(--text-light);margin-top:16px}
.register-form{display:none}

/* ===== App Layout ===== */
.app-layout{display:flex;flex-direction:column;background:var(--bg)}
.app-header{background:var(--card);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{font-size:22px}
.header-title{font-size:16px;font-weight:600;color:var(--text)}
.header-right{display:flex;align-items:center;gap:10px}
.header-user{font-size:13px;color:var(--text-light)}
.btn-logout{padding:6px 14px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:0 0;color:var(--danger);cursor:pointer}
.btn-back{padding:6px 12px;font-size:13px;border:none;border-radius:6px;background:var(--primary-light);color:var(--primary);cursor:pointer}

/* ===== Home Page ===== */
.home-main{padding:12px 20px;max-width:800px;margin:0 auto;width:100%}
.welcome-section{margin-bottom:8px}
.welcome-section h2{font-size:20px;font-weight:700;margin-bottom:2px}
.welcome-name{color:var(--primary)}
.welcome-section p{font-size:14px;color:var(--text-light)}
.subject-grid{display:grid;grid-template-columns:1fr;gap:6px}
.subject-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:4px solid var(--card-color)}
.subject-card:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.12)}
.card-icon{font-size:28px;width:40px;text-align:center}
.card-info{flex:1}
.card-name{font-size:15px;font-weight:600;margin-bottom:1px}
.card-count{font-size:13px;color:var(--text-light)}
.card-coming{opacity:.7;cursor:default}

/* ===== Practice Page ===== */
.practice-main{padding:8px 20px;max-width:720px;margin:0 auto;width:100%}
.progress-bar-container{height:4px;background:var(--border);border-radius:2px;margin-bottom:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.stats-row{display:flex;gap:12px;margin-bottom:6px;font-size:13px}
.stat{font-size:13px}
.question-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:10px}
.q-meta{font-size:12px;color:var(--text-light);margin-bottom:6px}
.q-type-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--primary-light);color:var(--primary);margin-bottom:14px}
.q-text{font-size:16px;line-height:1.6;margin-bottom:14px;font-weight:500}
.q-options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.option-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.option-item:hover{border-color:var(--primary);background:var(--primary-light)}
.option-item.selected{border-color:var(--primary);background:var(--primary-light)}
.option-item.correct{border-color:#16a34a;background:#f0fdf4}
.option-item.wrong{border-color:#dc2626;background:#fef2f2}
.option-key{font-weight:700;font-size:14px;min-width:22px;color:var(--text-light)}
.option-text{font-size:14px;line-height:1.5}
.option-check{font-size:16px;min-width:22px;color:var(--text-light)}
.q-input-area{margin-bottom:16px}
.q-input-area textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;line-height:1.6;resize:vertical;font-family:inherit;outline:none}
.q-input-area textarea:focus{border-color:var(--primary)}
.btn-submit-answer{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:var(--primary);color:#fff;cursor:pointer;margin-top:8px}
.q-result{margin-bottom:16px;padding:14px;border-radius:8px;background:#f8fafc}
.result-header{font-size:14px;font-weight:600;margin-bottom:8px}
.result-correct{color:#16a34a}
.result-wrong{color:#dc2626}
.result-answer{font-size:15px;line-height:1.6;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.result-hint{font-size:12px;color:var(--text-light);margin-bottom:10px}
.self-eval{display:flex;gap:10px}
.btn-eval{flex:1;padding:10px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.correct-btn{background:#f0fdf4;color:#16a34a;border:1px solid #16a34a}
.wrong-btn{background:#fef2f2;color:#dc2626;border:1px solid #dc2626}
.q-explanation{padding:14px;border-radius:8px;background:#fffbeb;border:1px solid #fde68a}
.explanation-title{font-size:13px;font-weight:600;color:#92400e;margin-bottom:6px}
.explanation-text{font-size:14px;line-height:1.6;color:#78350f;margin-bottom:6px}
.explanation-source{font-size:12px;color:#a16207}
.nav-buttons{display:flex;gap:10px;margin-bottom:16px}
.btn-nav{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;background:var(--card);transition:all .15s}
.btn-nav:hover{background:var(--primary-light)}
.btn-show-answer{background:var(--primary);color:#fff;border:none;font-weight:600}
.btn-next{background:var(--primary);color:#fff;border:none;font-weight:600}
.end-actions{display:flex;gap:12px;justify-content:center}
.btn-primary2{padding:12px 28px;border:none;border-radius:8px;font-size:14px;font-weight:600;background:var(--primary);color:#fff;cursor:pointer}
.btn-restart{background:#f59e0b}

/* ===== Finish Card ===== */
.finish-card{text-align:center;padding:20px}
.finish-icon{font-size:48px;margin-bottom:12px}
.finish-title{font-size:22px;font-weight:700;margin-bottom:20px}
.finish-stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.finish-stat-item{display:flex;flex-direction:column;align-items:center}
.finish-num{font-size:28px;font-weight:700}
.finish-label{font-size:12px;color:var(--text-light);margin-top:2px}

/* ===== Mobile ===== */
@media(max-width:600px){
  .login-card{padding:24px 16px}
  .login-card h1{font-size:18px}
  .app-header{padding:8px 14px}
  .header-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
  .header-user{font-size:12px}
  .home-main{padding:8px 14px}
  .welcome-section{margin-bottom:6px}
  .welcome-section h2{font-size:17px}
  .welcome-section p{font-size:12px}
  .practice-main{padding:6px 14px}
  .question-card{padding:14px}
  .q-text{font-size:15px;word-break:break-word}
  .subject-card{padding:10px 12px;gap:8px}
  .subject-card .card-icon{font-size:24px;width:36px}
  .subject-card .card-name{font-size:14px}
  .subject-card .card-count{font-size:12px}
  .subject-card .card-info button{font-size:11px!important;padding:4px 10px!important;white-space:nowrap}
  .finish-stats{gap:12px}
  .finish-num{font-size:22px}
  .finish-icon{font-size:36px}
  .finish-title{font-size:17px}
  .option-item{padding:8px 10px}
  .option-text{font-size:13px}
  .option-key{font-size:13px;min-width:20px}
  .nav-buttons{gap:4px}
  .btn-nav{padding:8px;font-size:12px}
  .stats-row{font-size:12px;gap:8px}
  .q-meta{font-size:11px}
  .q-type-badge{font-size:10px;padding:2px 8px}
  .q-explanation{padding:10px}
  .explanation-text{font-size:13px}
  .btn-primary2{padding:8px 16px;font-size:12px}
  .end-actions{gap:6px;flex-wrap:wrap}
  .end-actions .btn-primary2{flex:1;min-width:100px}
}
@media(max-width:380px){
  .login-card{padding:16px 12px}
  .login-card h1{font-size:16px}
  .subject-card{padding:8px 10px;gap:6px}
  .subject-card .card-icon{font-size:20px;width:28px}
  .subject-card .card-info button{font-size:10px!important;padding:3px 8px!important}
  .header-title{max-width:120px;font-size:13px}
  .home-main{padding:6px 10px}
  .practice-main{padding:4px 10px}
  .q-text{font-size:14px}
  .btn-nav{padding:6px;font-size:11px}
}
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1>国际中文教师证书</h1>
    <div class="subtitle">考试练习系统</div>
    <div id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUser" placeholder="请输入用户名" maxlength="20">
        <div class="error" id="loginUserError">请输入用户名</div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码" maxlength="30">
        <div class="error" id="loginPassError">请输入密码</div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe">记住我</label>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">登 录</button>
      <div class="login-tip" id="loginTip" style="color:var(--danger);display:none"></div>
      <div class="divider">或</div>
      <button class="btn btn-ghost" onclick="showRegister()">注册新账号</button>
    </div>
    <div class="register-form" id="registerForm">
      <h2 style="font-size:18px;margin-bottom:16px;text-align:center">注册新账号</h2>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="regUser" placeholder="请输入用户名（4-20位）" maxlength="20">
        <div class="error" id="regUserError" style="display:block"></div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="regPass" placeholder="请输入密码（4-30位）" maxlength="30">
        <div class="error" id="regPassError" style="display:block"></div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="regPass2" placeholder="再次输入密码" maxlength="30">
        <div class="error" id="regPass2Error" style="display:block"></div>
      </div>
      <button class="btn btn-primary" onclick="doRegister()">注 册</button>
      <div class="login-tip" id="regTip" style="display:none"></div>
      <div class="divider"></div>
      <button class="btn btn-ghost" onclick="showLogin()">返回登录</button>
    </div>
    <div class="login-tip" id="accountInfo">管理员: admin | 练习: dj</div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app-page" id="appPage" style="display:none"></div>

<script src="questions_xh.js"></script>
<script src="questions_wh.js"></script>
<script src="questions_ll.js"></script>
<script>
// ===== 全局错误捕获（调试用）=====
window.onerror = function(msg, url, line, col, error) {
  var errDiv = document.getElementById('debugErrorDisplay') || (function(){
    var d = document.createElement('div');
    d.id = 'debugErrorDisplay';
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:red;color:white;padding:10px;font-size:12px;z-index:99999;font-family:monospace;white-space:pre-wrap;max-height:200px;overflow:auto';
    document.body.appendChild(d);
    return d;
  })();
  var errMsg = '🚨 ' + (msg || 'unknown') + ' | line:' + line + ' | col:' + col;
  errDiv.innerHTML += '\n' + errMsg;
  console.error('CAPTURED:', msg, line, col);
  return false;
};

// Normalize question objects
[questions_xh, questions_wh, questions_ll].forEach(arr => {
  arr.forEach(q => {
    if (!q.question && q.content) q.question = q.content;
  });
});

const subjects = [
  { id: 'xh', name: '现代汉语', icon: '📖', count: questions_xh.length, color: '#2563eb' },
  { id: 'wh', name: '中国文化', icon: '🏯', count: questions_wh.length, color: '#7c3aed' },
  { id: 'll', name: '对外汉语教学理论', icon: '🎓', count: questions_ll.length, color: '#0891b2' }
];


let currentUser = '';
let currentSubject = null;
let practiceQuestions = [];
let currentIndex = 0;
let answered = false;
let correctCount = 0;
let wrongCount = 0;
let selectedOptions = [];

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a) { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

// ===== 中文数字转换 =====
var CNUM = ['〇','一','二','三','四','五','六','七','八','九','十'];
function toChineseNum(n) {
  if (n < 0 || n > 999) return String(n);
  if (n <= 10) return CNUM[n];
  if (n < 20) return '十' + (n > 10 ? CNUM[n % 10] : '');
  var s = '';
  if (n >= 100) { s += CNUM[Math.floor(n / 100)] + '百'; n %= 100; if (n < 10 && n > 0) s += '零'; }
  if (n >= 10) { s += CNUM[Math.floor(n / 10)] + '十'; n %= 10; }
  if (n > 0) { s += CNUM[n]; } else if (s.length > 0 && s.slice(-1) === '十' && n === 0) { /* keep */ }
  return s;
}

// ===== 进度存取 =====
function savePracticeProgress(username, subjectId, index, total) {
  if (!username) return;
  var completed = index >= total;
  localStorage.setItem('quiz_progress_' + username + '_' + subjectId, JSON.stringify({
    index: completed ? 0 : index,
    completed: completed,
    total: total
  }));
}
function loadPracticeProgress(username, subjectId) {
  if (!username) return null;
  try { return JSON.parse(localStorage.getItem('quiz_progress_' + username + '_' + subjectId)); } catch(e) {}
  return null;
}
function clearPracticeProgress(username, subjectId) {
  if (!username) return;
  localStorage.removeItem('quiz_progress_' + username + '_' + subjectId);
}

// ===== 错题存取 =====
function getWrongQuestions(username, subjectId) {
  if (!username) return [];
  try { return JSON.parse(localStorage.getItem('quiz_wrong_' + username + '_' + subjectId) || '[]'); } catch(e) {}
  return [];
}
function saveWrongQuestions(username, subjectId, questions) {
  if (!username) return;
  localStorage.setItem('quiz_wrong_' + username + '_' + subjectId, JSON.stringify(questions));
}
function addWrongQuestion(username, subjectId, q) {
  var wrongs = getWrongQuestions(username, subjectId);
  if (!wrongs.some(function(w) { return w.id === q.id && w.subject === q.subject; })) {
    wrongs.push(JSON.parse(JSON.stringify(q)));
    saveWrongQuestions(username, subjectId, wrongs);
  }
}
function getWrongProgress(username, subjectId) {
  if (!username) return null;
  try { return JSON.parse(localStorage.getItem('quiz_wrong_progress_' + username + '_' + subjectId)); } catch(e) {}
  return null;
}
function saveWrongProgress(username, subjectId, index, total) {
  if (!username) return;
  localStorage.setItem('quiz_wrong_progress_' + username + '_' + subjectId, JSON.stringify({ index: index, total: total }));
}

// ===== 题干乱码过滤 =====
function filterErrorText(str) {
  if (!str) return '';
  // 剔除无意义碎片字符
  var errorWords = ["一一六","一二一","零散错字"];
  errorWords.forEach(function(word) {
    // Only clean if the word appears as a fragment in an otherwise valid sentence
    str = str.replace(word, '');
  });
  return str;
}

// ===== 预设账号 =====
const PRESET_USERS = {
  admin: { password: 'admin123', role: 'admin' },
  dj:    { password: 'dj123',    role: 'user' }
};

// ===== 初始化 =====
(function init() {
  const saved = localStorage.getItem('quiz_user');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.username && data.password) {
        document.getElementById('loginUser').value = data.username;
        document.getElementById('loginPass').value = data.password;
        document.getElementById('rememberMe').checked = true;
      }
    } catch(e) {}
  }
})();

// ===== 登录 =====
function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const tipEl = document.getElementById('loginTip');
  const userErr = document.getElementById('loginUserError');
  const passErr = document.getElementById('loginPassError');
  userErr.style.display = 'none'; passErr.style.display = 'none'; tipEl.style.display = 'none';
  if (!username) { userErr.style.display = 'block'; return; }
  if (!password) { passErr.style.display = 'block'; return; }
  if (PRESET_USERS[username] && PRESET_USERS[username].password === password) {
    loginSuccess(username, password); return;
  }
  const users = getRegisteredUsers();
  if (users[username] && users[username].password === password) {
    loginSuccess(username, password); return;
  }
  tipEl.textContent = '用户名或密码错误'; tipEl.style.display = 'block';
}

function loginSuccess(username, password) {
  if (document.getElementById('rememberMe').checked) {
    localStorage.setItem('quiz_user', JSON.stringify({ username, password }));
  } else { localStorage.removeItem('quiz_user'); }
  currentUser = username;
  sessionStorage.setItem('quiz_session', JSON.stringify({ username }));
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  showHome();
}

function getRegisteredUsers() { try { return JSON.parse(localStorage.getItem('quiz_registered') || '{}'); } catch(e) { return {}; } }
function saveRegisteredUsers(u) { localStorage.setItem('quiz_registered', JSON.stringify(u)); }

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('accountInfo').style.display = 'none';
  ['regUserError','regPassError','regPass2Error'].forEach(id => document.getElementById(id).textContent = '');
}

function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('accountInfo').style.display = 'block';
  document.getElementById('regTip').style.display = 'none';
}

function doRegister() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value.trim();
  const password2 = document.getElementById('regPass2').value.trim();
  const tipEl = document.getElementById('regTip');
  ['regUserError','regPassError','regPass2Error'].forEach(id => document.getElementById(id).textContent = '');
  tipEl.style.display = 'none';
  if (!username || username.length < 2) { document.getElementById('regUserError').textContent = '用户名至少2个字符'; return; }
  if (!password || password.length < 3) { document.getElementById('regPassError').textContent = '密码至少3个字符'; return; }
  if (password !== password2) { document.getElementById('regPass2Error').textContent = '两次密码不一致'; return; }
  if (PRESET_USERS[username]) { document.getElementById('regUserError').textContent = '该用户名已被使用'; return; }
  const users = getRegisteredUsers();
  if (users[username]) { document.getElementById('regUserError').textContent = '该用户名已注册'; return; }
  users[username] = { password, role: 'user' };
  saveRegisteredUsers(users);
  tipEl.style.color = 'var(--success)'; tipEl.textContent = '注册成功！请返回登录'; tipEl.style.display = 'block';
  setTimeout(showLogin, 1500);
}

// ===== 刷题 =====
function startPractice(subjectId) {
  currentSubject = subjectId;
  var questions, name;
  var sub = subjects.find(function(s) { return s.id === subjectId; });
  name = sub ? sub.name : subjectId;
  if (subjectId === 'xh') questions = questions_xh;
  else if (subjectId === 'wh') questions = questions_wh;
  else if (subjectId === 'll') questions = questions_ll;
  if (!questions) return;
  // Check if user completed this subject before - reshuffle
  var prog = loadPracticeProgress(currentUser, subjectId);
  if (prog && prog.completed) {
    practiceQuestions = shuffle(questions);
    currentIndex = 0;
    clearPracticeProgress(currentUser, subjectId);
  } else if (prog && prog.index > 0) {
    practiceQuestions = shuffle(questions);
    currentIndex = Math.min(prog.index, questions.length - 1);
  } else {
    practiceQuestions = shuffle(questions);
    currentIndex = 0;
  }
  correctCount = 0; wrongCount = 0; answered = false;
  showPracticePage(name);
  showQuestion();
}

  app.innerHTML = '<div class="app-layout">' +

function showQuestion() {
  if (currentIndex >= practiceQuestions.length) { finishPractice(); return; }
  var q = practiceQuestions[currentIndex];
  var total = practiceQuestions.length;
  document.getElementById('progressText').textContent = (currentIndex+1) + '/' + total;
  document.getElementById('progressBar').style.width = ((currentIndex / total) * 100) + '%';
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  answered = false;
  document.getElementById('qResult').style.display = 'none';
  document.getElementById('qExplanation').style.display = 'none';
  document.getElementById('qInputArea').style.display = 'none';
  document.getElementById('showAnsBtn').style.display = 'block';
  document.getElementById('endActions').style.display = 'none';
  document.getElementById('prevBtn').style.display = currentIndex > 0 ? 'block' : 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = '下一题 →';

  document.getElementById('qMeta').textContent = '第' + toChineseNum(currentIndex+1) + '题 | ' + (q.chapter || '');
  var typeMap = {'单选':'单选题','多选':'多选题','填空':'填空题','名词解释':'名词解释','改错':'改错题'};
  document.getElementById('qTypeBadge').textContent = typeMap[q.type] || q.type;
  document.getElementById('qText').textContent = filterErrorText(q.question || q.content || '');

  var optsDiv = document.getElementById('qOptions');
  optsDiv.innerHTML = '';
  selectedOptions = [];

  if (q.options && q.type === '单选') {
    var keys = Object.keys(q.options);
    optsDiv.innerHTML = keys.map(function(k) {
      return '<div class="option-item" onclick="selectOption(this,\'' + k + '\')"><span class="option-key">' + k + '</span><span class="option-text">' + esc(q.options[k]) + '</span></div>';
    }).join('');
  } else if (q.options && q.type === '多选') {
    var keys = Object.keys(q.options);
    optsDiv.innerHTML = keys.map(function(k) {
      return '<div class="option-item option-multi" onclick="toggleMulti(this,\'' + k + '\')" data-key="' + k + '"><span class="option-check">□</span><span class="option-key">' + k + '</span><span class="option-text">' + esc(q.options[k]) + '</span></div>';
    }).join('') + '<button onclick="submitMulti()" class="btn-submit-answer">提交答案</button>';
  } else {
    document.getElementById('qInputArea').style.display = 'block';
    document.getElementById('freeInput').value = '';
  }
}

function selectOption(el, key) {
  if (answered) return;
  var all = document.querySelectorAll('.option-item');
  all.forEach(function(o) { o.classList.remove('selected'); });
  el.classList.add('selected');
  answered = true;
  var q = practiceQuestions[currentIndex];
  if (key === q.answer) { el.classList.add('correct'); correctCount++; }
  else {
    el.classList.add('wrong'); wrongCount++;
    addWrongQuestion(currentUser, currentSubject, q);
    all.forEach(function(o) {
      if (o.textContent.trim().startsWith(q.answer)) o.classList.add('correct');
    });
  }
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('showAnsBtn').style.display = 'none';
  showAnswerResult(key === q.answer, q.answer);
  showExplanation();
}

function toggleMulti(el, key) {
  if (answered) return;
  el.classList.toggle('selected');
  var idx = selectedOptions.indexOf(key);
  if (idx >= 0) selectedOptions.splice(idx, 1);
  else selectedOptions.push(key);
  el.querySelector('.option-check').textContent = el.classList.contains('selected') ? '☑' : '□';
}

function submitMulti() {
  if (answered) return;
  var q = practiceQuestions[currentIndex];
  var correctAns = q.answer.split('').sort().join('');
  var userAns = selectedOptions.slice().sort().join('');
  answered = true;
  document.getElementById('showAnsBtn').style.display = 'none';
  if (userAns === correctAns) { correctCount++; showAnswerResult(true, q.answer); }
  else { wrongCount++; showAnswerResult(false, q.answer); addWrongQuestion(currentUser, currentSubject, q); }
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  showExplanation();
}

function submitFreeAnswer() {
  if (answered) return;
  answered = true;
  document.getElementById('showAnsBtn').style.display = 'none';
  document.getElementById('qInputArea').style.display = 'none';
  var q = practiceQuestions[currentIndex];
  var resultDiv = document.getElementById('qResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<div class="result-header">📝 参考答案</div><div class="result-answer">' + esc(q.answer) + '</div>' +
    '<div class="result-hint">对照答案，请自行判断是否正确</div>' +
    '<div class="self-eval"><button onclick="selfEval(true)" class="btn-eval correct-btn">✅ 我答对了</button><button onclick="selfEval(false)" class="btn-eval wrong-btn">❌ 我答错了</button></div>';
}

function selfEval(isCorrect) {
  if (isCorrect) correctCount++;
  else { wrongCount++; addWrongQuestion(currentUser, currentSubject, practiceQuestions[currentIndex]); }
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  showExplanation();
}

function showAnswerResult(isCorrect, answer) {
  var resultDiv = document.getElementById('qResult');
  resultDiv.style.display = 'block';
  if (isCorrect) resultDiv.innerHTML = '<div class="result-header result-correct">✅ 回答正确！</div>';
  else resultDiv.innerHTML = '<div class="result-header result-wrong">❌ 回答错误</div><div class="result-answer">正确答案：' + esc(answer) + '</div>';
}

function showExplanation() {
  var q = practiceQuestions[currentIndex];
  var explDiv = document.getElementById('qExplanation');
  explDiv.style.display = 'block';
  explDiv.innerHTML = '<div class="explanation-title">💡 解析</div><div class="explanation-text">' + esc(q.explanation || '暂无解析') + '</div><div class="explanation-source">📌 出处：' + esc(q.source || '') + '</div>';
}

function showAnswer() {
  if (answered) return;
  document.getElementById('showAnsBtn').style.display = 'none';
  var q = practiceQuestions[currentIndex];
  wrongCount++;
  addWrongQuestion(currentUser, currentSubject, q);
  document.getElementById('wrongCount').textContent = wrongCount;
  showAnswerResult(null, q.answer);
  showExplanation();
}

function nextQuestion() {
  if (!answered) { wrongCount++; }
  currentIndex++; 
  savePracticeProgress(currentUser, currentSubject, currentIndex, practiceQuestions.length);
  showQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; answered = false; 
    savePracticeProgress(currentUser, currentSubject, currentIndex, practiceQuestions.length);
    showQuestion(); 
  }
}

function finishPractice() {
  var total = practiceQuestions.length;
  savePracticeProgress(currentUser, currentSubject, total, total);
  document.getElementById('progressText').textContent = total + '/' + total;
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('showAnsBtn').style.display = 'none';
  document.getElementById('endActions').style.display = 'flex';
  var pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  document.getElementById('questionCard').innerHTML = '<div class="finish-card"><div class="finish-icon">🎉</div><div class="finish-title">刷题完成！</div><div class="finish-stats">' +
    '<div class="finish-stat-item"><span class="finish-num">' + total + '</span><span class="finish-label">总题数</span></div>' +
    '<div class="finish-stat-item"><span class="finish-num" style="color:#16a34a">' + correctCount + '</span><span class="finish-label">正确</span></div>' +
    '<div class="finish-stat-item"><span class="finish-num" style="color:#dc2626">' + wrongCount + '</span><span class="finish-label">错误</span></div>' +
    '<div class="finish-stat-item"><span class="finish-num" style="color:' + (pct >= 70 ? '#16a34a' : '#dc2626') + '">' + pct + '%</span><span class="finish-label">正确率</span></div></div></div>';
}

function restartPractice() { if (currentSubject) startPractice(currentSubject); }

function startExam(paperId) {
  loadPaperData(function() { _startExam(paperId); });

function _startExam(paperId) {
  var questions = questions_papers[paperId];
  if (!questions || questions.length === 0) return;
  examCurrentPaper = paperId;
  examQuestions = questions.slice(); // copy, keep original order
  // Check saved progress
  var key = 'quiz_exam_progress_' + currentUser + '_' + paperId;
  try {
    var saved = JSON.parse(localStorage.getItem(key));
    if (saved && saved.completed) {
      examCurrentIndex = 0;
      localStorage.removeItem(key);
    } else if (saved && saved.index > 0) {
      examCurrentIndex = Math.min(saved.index, examQuestions.length - 1);
    } else {
      examCurrentIndex = 0;
    }
  } catch(e) { examCurrentIndex = 0; }
  
  examCorrectCount = 0; examWrongCount = 0; examAnswered = false;
  showExamPage(paperId);
  showExamQuestion();
}

function showExamQuestion() {

  var total = examQuestions.length;
  document.getElementById('examProgressText').textContent = (examCurrentIndex+1) + '/' + total;
  document.getElementById('examProgressBar').style.width = ((examCurrentIndex / total) * 100) + '%';

function selectExamOption(el, key) {

  var all = document.querySelectorAll('#examQOptions .option-item');

    });

  if (explanation) {
    var explDiv = document.getElementById('examQExplanation');
    explDiv.style.display = 'block';
    explDiv.innerHTML = '<div class="explanation-title">💡 解析</div><div class="explanation-text">' + esc(explanation) + '</div>';
  }
}

function saveExamProgress() {
  if (!currentUser || !examCurrentPaper) return;
  var key = 'quiz_exam_progress_' + currentUser + '_' + examCurrentPaper;
  var total = examQuestions.length;
  var completed = examCurrentIndex >= total;
  localStorage.setItem(key, JSON.stringify({
    index: completed ? 0 : examCurrentIndex,
    completed: completed,
    total: total
  }));
}

function nextExamQuestion() {
  if (!examAnswered) { examWrongCount++; }
  examCurrentIndex++;
  saveExamProgress();
  showExamQuestion();
}

function prevExamQuestion() {
  if (examCurrentIndex > 0) { examCurrentIndex--; examAnswered = false; saveExamProgress(); showExamQuestion(); }
}

    '<div class="finish-stat-item"><span class="finish-num" style="color:#16a34a">' + examCorrectCount + '</span><span class="finish-label">正确</span></div>' +
    '<div class="finish-stat-item"><span class="finish-num" style="color:#dc2626">' + examWrongCount + '</span><span class="finish-label">错误</span></div>' +
    '<div class="finish-stat-item"><span class="finish-num" style="color:' + (pct >= 70 ? '#16a34a' : '#dc2626') + '">' + pct + '%</span><span class="finish-label">正确率</span></div></div></div>';
}

function restartExam() { startExam(examCurrentPaper); }

// ===== 历年真题错题本 =====
function addExamWrongQuestion(q) {
  if (!currentUser) return;
  var key = 'quiz_exam_wrong_' + currentUser;
  var wrongs = [];
  try { wrongs = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  if (!wrongs.some(function(w) { return w.id === q.id && w.paper === examCurrentPaper; })) {
    var copy = JSON.parse(JSON.stringify(q));
    copy.examPaper = examCurrentPaper;
    wrongs.push(copy);
    localStorage.setItem(key, JSON.stringify(wrongs));
  }
}

function getExamWrongQuestions() {
  if (!currentUser) return [];
  try { return JSON.parse(localStorage.getItem('quiz_exam_wrong_' + currentUser) || '[]'); } catch(e) {}
  return [];
}

function showExamWrongBook() {
  var wrongs = getExamWrongQuestions();
  var app = document.getElementById('appPage');
  app.innerHTML = '<div class="app-layout">' +
    '<header class="app-header"><div class="header-left"><button onclick="showHome()" class="btn-back">← 返回</button><span class="header-title">历年真题错题本</span></div>' +
    '<div class="header-right"><span class="header-user">👤 ' + esc(currentUser) + '</span></div></header>' +
    '<main class="practice-main">' +
    '<div class="finish-card" style="text-align:center;padding:40px 20px"><div class="finish-icon">📕</div>' +
    '<div class="finish-title" style="font-size:20px;margin-bottom:8px">历年真题错题本</div>' +
    '<p style="font-size:14px;color:var(--text-light);margin-bottom:20px">共收录 <strong style="color:var(--danger)">' + wrongs.length + '</strong> 道错题</p>' +
    (wrongs.length > 0 ? '<button onclick="startExamWrongPractice()" class="btn-primary2" style="margin-bottom:12px">📖 开始复习错题</button>' : '<p style="font-size:13px;color:var(--text-light)">暂无错题记录</p>') +
    '<div style="margin-top:12px"><button onclick="showHome()" class="btn-primary2" style="background:var(--text-light)">← 返回首页</button></div></div>' +
    '</main></div>';
}

var examWrongQuestions = [];
var examWrongIndex = 0;

function startExamWrongPractice() {
  var wrongs = getExamWrongQuestions();
  if (!wrongs || wrongs.length === 0) { showExamWrongBook(); return; }
  examWrongQuestions = shuffle(wrongs);
  examWrongIndex = 0;
  showExamWrongPage();
  showExamWrongQuestion();
}

function showExamWrongPage() {
  var app = document.getElementById('appPage');
  app.innerHTML = '<div class="app-layout">' +
    '<header class="app-header"><div class="header-left"><button onclick="showExamWrongBook()" class="btn-back">← 错题本</button><span class="header-title">错题复习</span></div>' +
    '<div class="header-right"><span class="progress-text" id="ewProgressText">0/0</span></div></header>' +
    '<main class="practice-main">' +
    '<div class="progress-bar-container"><div class="progress-bar" id="ewProgressBar"></div></div>' +
    '<div class="question-card" id="ewQuestionCard">' +
    '<div class="q-meta" id="ewQMeta"></div>' +
    '<div class="q-type-badge" id="ewQTypeBadge"></div>' +
    '<div class="q-text" id="ewQText"></div>' +
    '<div class="q-options" id="ewQOptions"></div>' +
    '<div class="q-result" id="ewQResult"></div>' +
    '<div class="q-explanation" id="ewQExplanation"></div></div>' +
    '<div class="nav-buttons">' +
    '<button onclick="prevExamWrong()" class="btn-nav" id="ewPrevBtn">← 上一题</button>' +
    '<button onclick="nextExamWrong()" class="btn-nav btn-next" id="ewNextBtn">下一题 →</button></div>' +
    '<div class="end-actions" id="ewEndActions" style="display:none">' +
    '<button onclick="showExamWrongBook()" class="btn-primary2">← 返回错题本</button>' +
    '<button onclick="restartExamWrong()" class="btn-primary2 btn-restart">🔄 重新复习</button></div>' +
    '</main></div>';
}

function showExamWrongQuestion() {
  if (examWrongIndex >= examWrongQuestions.length) { finishExamWrong(); return; }
  var q = examWrongQuestions[examWrongIndex];
  var total = examWrongQuestions.length;
  document.getElementById('ewProgressText').textContent = (examWrongIndex+1) + '/' + total;
  document.getElementById('ewProgressBar').style.width = ((examWrongIndex / total) * 100) + '%';
  document.getElementById('ewPrevBtn').style.display = examWrongIndex > 0 ? 'block' : 'none';
  document.getElementById('ewNextBtn').style.display = 'block';
  document.getElementById('ewNextBtn').textContent = '下一题 →';
  document.getElementById('ewEndActions').style.display = 'none';
  
  document.getElementById('ewQMeta').textContent = (q.examPaper || '') + ' | 第' + toChineseNum(examWrongIndex+1) + '题';
  var typeMap = {'单选':'单选题','多选':'多选题','填空':'填空题','名词解释':'名词解释','改错':'改错题'};
  document.getElementById('ewQTypeBadge').textContent = typeMap[q.type] || q.type || '单选题';
  document.getElementById('ewQText').textContent = filterErrorText(q.question || '');
  
  var optsDiv = document.getElementById('ewQOptions');
  optsDiv.innerHTML = '';
  if (q.options && typeof q.options === 'object') {
    var keys = Object.keys(q.options);
    optsDiv.innerHTML = keys.map(function(k) {
      return '<div class="option-item" style="cursor:default;background:var(--bg)"><span class="option-key">' + k + '</span><span class="option-text">' + esc(q.options[k]) + '</span></div>';
    }).join('');
  }
  
  document.getElementById('ewQResult').innerHTML = '<div class="result-header" style="color:var(--primary)">✅ 正确答案：' + esc(q.answer || '') + '</div>';
  document.getElementById('ewQExplanation').innerHTML = q.explanation ? 
    '<div class="explanation-title">💡 解析</div><div class="explanation-text">' + esc(q.explanation) + '</div>' : '';
}

function nextExamWrong() { examWrongIndex++; showExamWrongQuestion(); }
function prevExamWrong() { if (examWrongIndex > 0) { examWrongIndex--; showExamWrongQuestion(); } }

function finishExamWrong() {
  var total = examWrongQuestions.length;
  document.getElementById('ewProgressText').textContent = total + '/' + total;
  document.getElementById('ewProgressBar').style.width = '100%';
  document.getElementById('ewNextBtn').style.display = 'none';
  document.getElementById('ewEndActions').style.display = 'flex';
  document.getElementById('ewQuestionCard').innerHTML = '<div class="finish-card"><div class="finish-icon">🎉</div><div class="finish-title">错题复习完成！</div><p style="font-size:14px;color:var(--text-light);margin-top:8px">共复习 <strong>' + total + '</strong> 道错题</p></div>';
}

function restartExamWrong() {
  examWrongQuestions = shuffle(getExamWrongQuestions());
  examWrongIndex = 0;
  showExamWrongPage();
  showExamWrongQuestion();
}

// ===== 错题本 =====
var wrongQuestions = [];
var wrongCurrentIndex = 0;
var wrongSubjectId = '';
var wrongSubjectName = '';

function showWrongBook(subjectId, subjectName) {
  wrongSubjectId = subjectId;
  wrongSubjectName = subjectName;
  var wrongs = getWrongQuestions(currentUser, subjectId);
  
  var app = document.getElementById('appPage');
  app.innerHTML = '<div class="app-layout">' +
    '<header class="app-header"><div class="header-left"><button onclick="showHome()" class="btn-back">← 返回</button><span class="header-title">错题本 - ' + esc(subjectName) + '</span></div>' +
    '<div class="header-right"><span class="header-user">👤 ' + esc(currentUser) + '</span></div></header>' +
    '<main class="practice-main">' +
    '<div class="finish-card" style="text-align:center;padding:40px 20px"><div class="finish-icon">📕</div>' +
    '<div class="finish-title" style="font-size:20px;margin-bottom:8px">' + esc(subjectName) + ' 错题本</div>' +
    '<p style="font-size:14px;color:var(--text-light);margin-bottom:20px">共收录 <strong style="color:var(--danger)">' + wrongs.length + '</strong> 道错题</p>' +
    (wrongs.length > 0 ? '<button onclick="startWrongPractice()" class="btn-primary2" style="margin-bottom:12px">📖 开始复习错题</button>' : '<p style="font-size:13px;color:var(--text-light)">暂无错题记录，继续刷题吧！</p>') +
    '<div style="margin-top:12px"><button onclick="showHome()" class="btn-primary2" style="background:var(--text-light)">← 返回首页</button></div></div>' +
    '</main></div>';
}

function startWrongPractice() {
  var wrongs = getWrongQuestions(currentUser, wrongSubjectId);
  if (!wrongs || wrongs.length === 0) { showWrongBook(wrongSubjectId, wrongSubjectName); return; }
  
  // Check if user previously completed reviewing all wrong questions
  var wp = getWrongProgress(currentUser, wrongSubjectId);
  var wc = JSON.parse(localStorage.getItem('quiz_wrong_completed_' + currentUser + '_' + wrongSubjectId) || '{}');
  if (wc && wc.completed) {
    wrongQuestions = shuffle(wrongs);
    wrongCurrentIndex = 0;
    saveWrongProgress(currentUser, wrongSubjectId, 0, wrongQuestions.length);
  } else if (wp && wp.index > 0) {
    wrongQuestions = shuffle(wrongs);
    wrongCurrentIndex = Math.min(wp.index, wrongQuestions.length - 1);
  } else {
    wrongQuestions = shuffle(wrongs);
    wrongCurrentIndex = 0;
  }
  
  showWrongPage();
  showWrongQuestion();
}

function showWrongPage() {
  var app = document.getElementById('appPage');
  app.innerHTML = '<div class="app-layout">' +
    '<header class="app-header"><div class="header-left"><button onclick="showWrongBook(wrongSubjectId,wrongSubjectName)" class="btn-back">← 错题本</button><span class="header-title">错题复习 - ' + esc(wrongSubjectName) + '</span></div>' +
    '<div class="header-right"><span class="progress-text" id="wrongProgressText">0/0</span></div></header>' +
    '<main class="practice-main">' +
    '<div class="progress-bar-container"><div class="progress-bar" id="wrongProgressBar"></div></div>' +
    '<div class="question-card" id="wrongQuestionCard">' +
    '<div class="q-meta" id="wrongQMeta"></div>' +
    '<div class="q-type-badge" id="wrongQTypeBadge"></div>' +
    '<div class="q-text" id="wrongQText"></div>' +
    '<div class="q-options" id="wrongQOptions"></div>' +
    '<div class="q-result" id="wrongQResult"></div>' +
    '<div class="q-explanation" id="wrongQExplanation"></div></div>' +
    '<div class="nav-buttons">' +
    '<button onclick="prevWrongQuestion()" class="btn-nav" id="wrongPrevBtn">← 上一题</button>' +
    '<button onclick="nextWrongQuestion()" class="btn-nav btn-next" id="wrongNextBtn">下一题 →</button></div>' +
    '<div class="end-actions" id="wrongEndActions" style="display:none">' +
    '<button onclick="showWrongBook(wrongSubjectId,wrongSubjectName)" class="btn-primary2">← 返回错题本</button>' +
    '<button onclick="restartWrongPractice()" class="btn-primary2 btn-restart">🔄 重新复习</button></div>' +
    '</main></div>';
}

function showWrongQuestion() {
  if (wrongCurrentIndex >= wrongQuestions.length) { finishWrongPractice(); return; }
  var q = wrongQuestions[wrongCurrentIndex];
  var total = wrongQuestions.length;
  document.getElementById('wrongProgressText').textContent = (wrongCurrentIndex+1) + '/' + total;
  document.getElementById('wrongProgressBar').style.width = ((wrongCurrentIndex / total) * 100) + '%';
  document.getElementById('wrongPrevBtn').style.display = wrongCurrentIndex > 0 ? 'block' : 'none';
  document.getElementById('wrongNextBtn').style.display = 'block';
  document.getElementById('wrongNextBtn').textContent = '下一题 →';
  document.getElementById('wrongEndActions').style.display = 'none';
  
  document.getElementById('wrongQMeta').textContent = '第' + toChineseNum(wrongCurrentIndex+1) + '题 | ' + (q.chapter || '');
  var typeMap = {'单选':'单选题','多选':'多选题','填空':'填空题','名词解释':'名词解释','改错':'改错题'};
  document.getElementById('wrongQTypeBadge').textContent = typeMap[q.type] || q.type;
  document.getElementById('wrongQText').textContent = filterErrorText(q.question || q.content || '');
  
  var optsDiv = document.getElementById('wrongQOptions');
  optsDiv.innerHTML = '';
  if (q.options && typeof q.options === 'object') {
    var keys = Object.keys(q.options);
    optsDiv.innerHTML = keys.map(function(k) {
      return '<div class="option-item" style="cursor:default;background:var(--bg)"><span class="option-key">' + k + '</span><span class="option-text">' + esc(q.options[k]) + '</span></div>';
    }).join('');
  }
  
  document.getElementById('wrongQResult').innerHTML = '<div class="result-header" style="color:var(--primary)">✅ 正确答案：' + esc(q.answer) + '</div>';
  
  document.getElementById('wrongQExplanation').innerHTML = 
    '<div class="explanation-title">💡 解析</div><div class="explanation-text">' + esc(q.explanation || '暂无解析') + '</div><div class="explanation-source">📌 出处：' + esc(q.source || '') + '</div>';
}

function nextWrongQuestion() {
  wrongCurrentIndex++;
  saveWrongProgress(currentUser, wrongSubjectId, wrongCurrentIndex, wrongQuestions.length);
  showWrongQuestion();
}

function prevWrongQuestion() {
  if (wrongCurrentIndex > 0) { 
    wrongCurrentIndex--; 
    saveWrongProgress(currentUser, wrongSubjectId, wrongCurrentIndex, wrongQuestions.length);
    showWrongQuestion(); 
  }
}

function finishWrongPractice() {
  var total = wrongQuestions.length;
  // Mark as completed so next time reshuffles
  saveWrongProgress(currentUser, wrongSubjectId, 0, total);
  // Store a separate flag for completed review
  localStorage.setItem('quiz_wrong_completed_' + currentUser + '_' + wrongSubjectId, JSON.stringify({ completed: true }));
  
  document.getElementById('wrongProgressText').textContent = total + '/' + total;
  document.getElementById('wrongProgressBar').style.width = '100%';
  document.getElementById('wrongNextBtn').style.display = 'none';
  document.getElementById('wrongEndActions').style.display = 'flex';
  document.getElementById('wrongQuestionCard').innerHTML = '<div class="finish-card"><div class="finish-icon">🎉</div><div class="finish-title">错题复习完成！</div><p style="font-size:14px;color:var(--text-light);margin-top:8px">共复习 <strong>' + total + '</strong> 道错题</p></div>';
}

function restartWrongPractice() {
  // Clear completed flag so it reshuffles
  localStorage.removeItem('quiz_wrong_completed_' + currentUser + '_' + wrongSubjectId);
  saveWrongProgress(currentUser, wrongSubjectId, 0, 0);
  startWrongPractice();
}

function logout() {
  sessionStorage.removeItem('quiz_session');
  localStorage.removeItem('quiz_user');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';
}


// 历年真题数据从 paperData.js 动态加载（不阻塞首页渲染）
var questions_papers = null;
var papers_list = null;

function loadPaperData(callback) {
  if (questions_papers && papers_list) {
    if (callback) callback();
    return;
  }
  var s = document.createElement('script');
  s.src = 'paperData.js';
  s.onload = function() {
    if (callback) callback();
  };
  s.onerror = function() {
    alert('加载真题数据失败，请刷新页面重试');
  };
  document.body.appendChild(s);
}


</script>
